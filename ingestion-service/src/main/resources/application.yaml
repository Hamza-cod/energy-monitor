spring:
  application:
    name: ingestion-service
  mvc:
    apiVersion:
      use:
        header: x-api-v
  kafka:
    bootstrap-servers: localhost:9094
    template:
      default-topic: energy-usage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Emit the __TypeId__ header so consumers resolve the concrete event type;
        # the shared common-lib package makes that id valid on both sides.
        spring.json.add.type.headers: true

# Continuous simulation configuration
simulation :
  endpoint: http://localhost:8082/api/ingestion
  apiVersion: v1
  requests-per-interval: 10000
  interval-ms: 60000
server:
  port: 8082