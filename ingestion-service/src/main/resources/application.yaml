spring:
  application:
    name: ingestion-service
  mvc:
    apiversion:
      # Without a default, Spring 7 rejects any request lacking the header with a
      # 400 - including springdoc's /v3/api-docs and calls proxied by the gateway.
      # Unversioned requests now resolve to v1; clients can still send x-api-v.
      default: "1"
      use:
        header: x-api-v
  kafka:
    bootstrap-servers: localhost:9094
    template:
      default-topic: energy-usage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Emit the __TypeId__ header so consumers resolve the concrete event type;
        # the shared common-lib package makes that id valid on both sides.
        spring.json.add.type.headers: true

# Continuous simulation configuration
simulation :
  endpoint: http://localhost:8082/api/ingestion
  apiVersion: v1
  requests-per-interval: 10000
  interval-ms: 60000
# Honour the gateway's X-Forwarded-* headers so springdoc advertises the gateway
# address in the OpenAPI "servers" list. Without this each service advertises its
# own localhost:<port>, and Swagger's "Try it out" bypasses the gateway (and is
# then blocked by CORS, since only the gateway is a permitted origin).
server:
  forward-headers-strategy: framework
  port: 8082

# Actuator & Micrometer. /actuator/prometheus is the scrape target; the
# application tag is what separates this service's series from the others once
# every service reports into the same Prometheus.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Percentile histograms let Prometheus aggregate latency across instances;
      # client-side percentiles cannot be averaged after the fact.
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true