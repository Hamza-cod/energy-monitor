# Honour the gateway's X-Forwarded-* headers so springdoc advertises the gateway
# address in the OpenAPI "servers" list. Without this each service advertises its
# own localhost:<port>, and Swagger's "Try it out" bypasses the gateway (and is
# then blocked by CORS, since only the gateway is a permitted origin).
server:
  forward-headers-strategy: framework
  port: 8084
spring:
  application:
    name: usage-service

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: usage-group

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        spring.json.trusted.packages: com.energymonitor.common.events
        spring.json.use.type.headers: true
        spring.json.value.default.type: com.energymonitor.common.events.EnergyUsageEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  mvc:
    apiversion:
      # Without a default, Spring 7 rejects any request lacking the header with a
      # 400 - including springdoc's /v3/api-docs and calls proxied by the gateway.
      # Unversioned requests now resolve to v1.0; clients can still send x-api-v.
      default: "1.0"
      use:
        header: x-api-v

  # Without a read timeout a hung peer pins the calling thread forever, which
  # exhausts the servlet pool and takes this service down with it. @Retryable
  # cannot help there: a call that never returns never throws.
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
influx-db:
    url: http://localhost:8072
    token: 512bit_token
    org: energy_monitor
    bucket: usage-bucket

device:
  client:
    base-url : http://localhost:8081

user:
  client:
    base-url: http://localhost:8080