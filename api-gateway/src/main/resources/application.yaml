spring:
  application:
    name: api-gateway

server:
  port: 8888

# Downstream service addresses. Bound to ServiceUris and overridable per
# environment via the matching env var (e.g. USER_SERVICE_URL in docker-compose).
services:
  user: ${USER_SERVICE_URL:http://localhost:8080}
  device: ${DEVICE_SERVICE_URL:http://localhost:8081}
  ingestion: ${INGESTION_SERVICE_URL:http://localhost:8082}
  usage: ${USAGE_SERVICE_URL:http://localhost:8084}
  insight: ${INSIGHT_SERVICE_URL:http://localhost:8088}

# Actuator & Prometheus
management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 8
        failureRateThreshold: 20
        minimumNumberOfCalls: 4
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      user-service:
        baseConfig: default
      device-service:
        baseConfig: default
      ingestion-service:
        baseConfig: default
      usage-service:
        baseConfig: default
      insight-service:
        baseConfig: default

  # A breaker only trips on failures, and a hung downstream never returns one.
  # TimeLimiter converts a slow call into the failure the breaker counts.
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
        cancelRunningFuture: true
    instances:
      user-service:
        baseConfig: default
      device-service:
        baseConfig: default
      ingestion-service:
        baseConfig: default
      usage-service:
        baseConfig: default
      # The LLM call is slow by nature, so it gets a longer leash than the rest.
      insight-service:
        baseConfig: default
        timeoutDuration: 30s
