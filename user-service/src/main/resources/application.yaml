spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/energy_monitor_db}
    username: ${DB_USERNAME:energy_monitor}
    password: ${DB_PASSWORD:energy_monitor_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
  mvc:
    apiversion:
      # Without a default, Spring 7 rejects any request lacking the header with a
      # 400 - including springdoc's /v3/api-docs and calls proxied by the gateway.
      # Unversioned requests now resolve to v1; clients can still send x-api-v.
      default: "1"
      use:
        header: x-api-v
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    org.flywaydb : debug
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG

# Honour the gateway's X-Forwarded-* headers so springdoc advertises the gateway
# address in the OpenAPI "servers" list. Without this each service advertises its
# own localhost:<port>, and Swagger's "Try it out" bypasses the gateway (and is
# then blocked by CORS, since only the gateway is a permitted origin).
server:
  forward-headers-strategy: framework
